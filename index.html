<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         background: #f0f2f5; color: #222; min-height: 100vh; padding: 24px 16px; }
  .container { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; text-align: center; margin-bottom: 20px; color: #1a1a2e; }
  .search-bar { display: flex; gap: 8px; margin-bottom: 16px; }
  input { flex: 1; padding: 12px 14px; font-size: 16px; border: 1px solid #ccc;
          border-radius: 8px; outline: none; }
  input:focus { border-color: #075e54; }
  button.search { padding: 12px 22px; font-size: 16px; border: none; border-radius: 8px;
                  background: #075e54; color: #fff; cursor: pointer; }
  button.search:active { background: #05463f; }
  .meta { font-size: 14px; color: #666; margin-bottom: 10px; min-height: 18px; }
  .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 12px;
          box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .row { display: flex; justify-content: space-between; align-items: center;
         padding: 7px 0; border-bottom: 1px solid #f0f0f0; font-size: 15px; }
  .row:last-child { border-bottom: none; }
  .label { color: #888; flex-shrink: 0; margin-right: 12px; }
  .value { text-align: right; word-break: break-all; font-weight: 500; }
  .value a { color: #075e54; text-decoration: none; font-weight: 600; }
  button.copy { margin-left: 8px; padding: 2px 10px; font-size: 12px; border: 1px solid #075e54;
                border-radius: 6px; background: #fff; color: #075e54; cursor: pointer; }
  .date-tag { text-align: center; font-size: 13px; color: #999; margin-top: 18px; }
  a.wa-btn { display: block; text-align: center; margin-top: 16px; padding: 13px 16px;
             font-size: 16px; font-weight: 600; color: #fff; background: #25D366;
             border-radius: 8px; text-decoration: none; }
  a.wa-btn:active { background: #1eb85a; }
</style>
</head>

</div>
<script>
const DATA = [{"sheet": "MW", "du": "12522-12723-NSO1", "seName": "AYOUDJ RIADH", "sePhone": "667943004", "seTel": "+213667943004", "owner": "NAILI", "ownerPhone": "562407946", "ownerTel": "+213562407946"}, {"sheet": "MW", "du": "30751-30714-HUFSO1", "seName": "BOUCHERIT Othmane", "sePhone": "792422739", "seTel": "+213792422739", "owner": "NAILI", "ownerPhone": "562407947", "ownerTel": "+213562407947"}, {"sheet": "MW", "du": "11607-11102-HUFSO1", "seName": "DJAYAHIA Salah Eddine Ayoubi", "sePhone": "793879292", "seTel": "+213793879292", "owner": "NAILI", "ownerPhone": "562407948", "ownerTel": "+213562407948"}, {"sheet": "MW", "du": "04566-04655-NFSO1", "seName": "Belkhedim adlen", "sePhone": "671663172", "seTel": "+213671663172", "owner": "NAILI", "ownerPhone": "562407949", "ownerTel": "+213562407949"}, {"sheet": "MW", "du": "17652-17604-ESFSO1", "seName": "GASMIA Rafik", "sePhone": "675657798", "seTel": "+213675657798", "owner": "NAILI", "ownerPhone": "562407950", "ownerTel": "+213562407950"}, {"sheet": "MW", "du": "17657-17652-SFSO1", "seName": "GASMIA Rafik", "sePhone": "675657798", "seTel": "+213675657798", "owner": "NAILI", "ownerPhone": "562407951", "ownerTel": "+213562407951"}, {"sheet": "MW", "du": "38302-38203-EN5GPO1", "seName": "SALIMBOURAHMANI", "sePhone": "554677922", "seTel": "+213554677922", "owner": "NAILI", "ownerPhone": "562407952", "ownerTel": "+213562407952"}, {"sheet": "MW", "du": "38671-38203-EN5GPO1", "seName": "SALIMBOURAHMANI", "sePhone": "554677922", "seTel": "+213554677922", "owner": "NAILI", "ownerPhone": "562407953", "ownerTel": "+213562407953"}, {"sheet": "WL", "du": "PO1-12522-GL+T8T-NEW-Out", "seName": "AYOUDJ RIADH", "sePhone": "667943004", "seTel": "+213667943004", "owner": "Raouf", "ownerPhone": "795009353", "ownerTel": "+213795009353"}, {"sheet": "WL", "du": "PO1-30706-TMM+L21-Exp-Ind", "seName": "BOUCHERIT Othmane", "sePhone": "66198011", "seTel": "+21366198011", "owner": "Raouf", "ownerPhone": "795009353", "ownerTel": "+213795009353"}, {"sheet": "WL", "du": "55113-5G-PO1-Ind", "seName": "AZEB Cheikh", "sePhone": "66198011", "seTel": "+21366198011", "owner": "Raouf", "ownerPhone": "795009353", "ownerTel": "+213795009353"}, {"sheet": "WL", "du": "17731-5G-PO1-Out", "seName": "GASMIA Rafik", "sePhone": "675657798", "seTel": "+213675657798", "owner": "Raouf", "ownerPhone": "795009353", "ownerTel": "+213795009353"}, {"sheet": "WL", "du": "17690-5G-PO1-Out", "seName": "GASMIA Rafik", "sePhone": "675657798", "seTel": "+213675657798", "owner": "Raouf", "ownerPhone": "795009353", "ownerTel": "+213795009353"}, {"sheet": "WL", "du": "17660-5G-PO1-Ind", "seName": "GASMIA Rafik", "sePhone": "675657798", "seTel": "+213675657798", "owner": "Raouf", "ownerPhone": "795009353", "ownerTel": "+213795009353"}, {"sheet": "WL", "du": "17698-5G-PO1-Ind", "seName": "GASMIA Rafik", "sePhone": "675657798", "seTel": "+213675657798", "owner": "Raouf", "ownerPhone": "795009353", "ownerTel": "+213795009353"}, {"sheet": "WL", "du": "17758-5G-PO1-Ind", "seName": "GASMIA Rafik", "sePhone": "675657798", "seTel": "+213675657798", "owner": "Raouf", "ownerPhone": "795009353", "ownerTel": "+213795009353"}];

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function phoneHtml(disp, tel) {
  if (!tel) return esc(disp);
  return '<a href="tel:' + tel + '">' + esc(disp) + '</a>';
}

function doSearch() {
  const q = document.getElementById('duInput').value.trim().toLowerCase();
  const meta = document.getElementById('meta');
  const box = document.getElementById('results');
  if (!q) { meta.textContent = ''; box.innerHTML = ''; return; }
  const hits = DATA.filter(r => r.du.toLowerCase().includes(q));
  if (!hits.length) {
    meta.textContent = 'DU ID: ' + q.toUpperCase() + ' — no record found';
    box.innerHTML = '';
    return;
  }
  meta.textContent = 'DU ID: ' + q.toUpperCase() + ' — ' + hits.length + ' record(s) found';
  box.innerHTML = hits.map(r =>
    '<div class="card">' +
    '<div class="row"><span class="label">Sheet</span><span class="value">' + esc(r.sheet) + '</span></div>' +
    '<div class="row"><span class="label">DU ID</span><span class="value">' + esc(r.du) +
      '<button class="copy" onclick="copyDu(this,\'' + r.du.replace(/'/g, "\\'") + '\')">Copy</button></span></div>' +
    '<div class="row"><span class="label">SE Name</span><span class="value">' + esc(r.seName) + '</span></div>' +
    '<div class="row"><span class="label">Contact</span><span class="value">' + phoneHtml(r.sePhone, r.seTel) + '</span></div>' +
    '<div class="row"><span class="label">OMC Owner</span><span class="value">' + esc(r.owner) + '</span></div>' +
    '<div class="row"><span class="label">Contact</span><span class="value">' + phoneHtml(r.ownerPhone, r.ownerTel) + '</span></div>' +
    '</div>'
  ).join('');
}

function copyDu(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'Copied';
    setTimeout(() => btn.textContent = 'Copy', 1500);
  });
}

document.getElementById('duInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

// 支持 ?duid=17731 直接查询
const param = new URLSearchParams(location.search).get('duid');
if (param) {
  document.getElementById('duInput').value = param;
  doSearch();
}

// 注册 Service Worker：每次打开页面自动校验服务器是否有新版本，避免旧缓存
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
