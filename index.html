          border-radius: 8px; outline: none; }

                  background: #075e54; color: #fff; cursor: pointer; }

  .meta { font-size: 14px; color: #666; margin-bottom: 10px; min-height: 18px; }
  .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 12px;
          box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .row { display: flex; justify-content: space-between; align-items: center;
         padding: 7px 0; border-bottom: 1px solid #f0f0f0; font-size: 15px; }
  .row:last-child { border-bottom: none; }
  .label { color: #888; flex-shrink: 0; margin-right: 12px; }
  .value { text-align: right; word-break: break-all; font-weight: 500; }
  .value a { color: #075e54; text-decoration: none; font-weight: 600; }
  button.copy { margin-left: 8px; padding: 2px 10px; font-size: 12px; border: 1px solid #075e54;
                border-radius: 6px; background: #fff; color: #075e54; cursor: pointer; }
  .date-tag { text-align: center; font-size: 13px; color: #999; margin-top: 18px; }
  a.wa-btn { display: block; text-align: center; margin-top: 16px; padding: 13px 16px;

             border-radius: 8px; text-decoration: none; }

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function phoneHtml(disp, tel) {
  if (!tel) return esc(disp);
  return '<a href="tel:' + tel + '">' + esc(disp) + '</a>';
}

function doSearch() {
  const q = document.getElementById('duInput').value.trim().toLowerCase();
  const meta = document.getElementById('meta');
  const box = document.getElementById('results');
  if (!q) { meta.textContent = ''; box.innerHTML = ''; return; }
  const hits = DATA.filter(r => r.du.toLowerCase().includes(q));
  if (!hits.length) {
    meta.textContent = 'DU ID: ' + q.toUpperCase() + ' — no record found';
    box.innerHTML = '';
    return;
  }
  meta.textContent = 'DU ID: ' + q.toUpperCase() + ' — ' + hits.length + ' record(s) found';
  box.innerHTML = hits.map(r =>
    '<div class="card">' +
    '<div class="row"><span class="label">Sheet</span><span class="value">' + esc(r.sheet) + '</span></div>' +
    '<div class="row"><span class="label">DU ID</span><span class="value">' + esc(r.du) +
      '<button class="copy" onclick="copyDu(this,\'' + r.du.replace(/'/g, "\\'") + '\')">Copy</button></span></div>' +
    '<div class="row"><span class="label">SE Name</span><span class="value">' + esc(r.seName) + '</span></div>' +
    '<div class="row"><span class="label">Contact</span><span class="value">' + phoneHtml(r.sePhone, r.seTel) + '</span></div>' +
    '<div class="row"><span class="label">OMC Owner</span><span class="value">' + esc(r.owner) + '</span></div>' +
    '<div class="row"><span class="label">Contact</span><span class="value">' + phoneHtml(r.ownerPhone, r.ownerTel) + '</span></div>' +
    '</div>'
  ).join('');
}

function copyDu(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'Copied';
    setTimeout(() => btn.textContent = 'Copy', 1500);
  });
}

document.getElementById('duInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

// 支持 ?duid=17731 直接查询
const param = new URLSearchParams(location.search).get('duid');
if (param) {
  document.getElementById('duInput').value = param;
  doSearch();
}

if ('serviceWorker' in navigator) {
